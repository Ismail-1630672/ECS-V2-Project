name: apply of ECS infra and blue-green deployment

on:
  workflow_dispatch:
    inputs:
      terraform_apply:
        description: "apply terraform code"
        required: true
        type: string

      confirmation:
        description: 'Type "yes" to confirm terraform changes'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
  OIDC_ROLE: ${{ vars.OIDC_ROLE }}
  TF_VERSION: "1.15.8"

jobs:
  terraform-plan:
    uses: ./.github/workflows/plan-apply.yml

  manual-approval:
    runs-on: ubuntu-latest
    steps:
      - name: manually approve terraform changes
        if: ${{ github.event.inputs.confirm != 'yes' }}
        run: |
          echo "Error: You must type yes for approval"
          exit 1

  terraform-apply:
    needs: [terraform-plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: download artifact from terraform plan job
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: plan-apply.yml
          name: tfplan
          path: infra/state
          workflow_conclusion: success
          branch: main

      - name: initialise terraform
        working-directory: infra
        run: |
          terraform init -backend-config="bucket=ismail-osman-ecs-v2-bucket" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="region=eu-west-2"

      - name: apply terraform
        working-directory: infra
        run: |
          terraform apply ./state/ecs-infra-plan.out --auto-approve
