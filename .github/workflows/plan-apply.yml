name: ECS infrastructure deployment

on:
  workflow_run:
    workflows: [Build and push docker image to ECR repo]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
  OIDC_ROLE: ${{ vars.OIDC_ROLE }}
  TF_VERSION: "1.15.8"

jobs:
  # docker-build-push:
  #   uses: ./.github/workflows/image.yml
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == "success" }}
    steps:
      - run: echo "The docker build and push workflow successeded"

  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == "failure"}}
    steps:
      - run: echo "The docker build and push workflow failed"

  terraform-plan:
    # needs: [docker-build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: initialise terraform
        working-directory: infra
        run: |
          terraform init -backend-config="bucket=ismail-osman-ecs-v2-bucket" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="region=eu-west-2"

      - name: plan for ecs infra
        working-directory: infra
        run: |
          mkdir -p state 
          terraform plan -var-file=ecsv2.tfvars -out=./state/ecs-infra-plan.out

      - name: upload tfplan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            infra/state/ecs-infra-plan.out
          if-no-files-found: error
          retention-days: 7
