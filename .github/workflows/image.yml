name: Build and push docker image to ECR repo
on:
  workflow_call:
    outputs:
      api-image:
        value: ${{ jobs.build-push.outputs.api-image }}
      dashboard-image:
        value: ${{ jobs.build-push.outputs.dashboard-image }}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
  OIDC_ROLE: ${{ vars.OIDC_ROLE }}
  IMAGE_TAG: ${{ github.sha }}
  API_ECR_REPO: ${{ vars.API_ECR_REPO }}
  WORKER_ECR_REPO: ${{ vars.WORKER_ECR_REPO }}
  DASHBOARD_ECR_REPO: ${{ vars.DASHBOARD_ECR_REPO }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      dashboard_image: ${{ steps.images.outputs.dashboard_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd app 
          docker build -t $ECR_REGISTRY/$API_ECR_REPO:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$API_ECR_REPO:$IMAGE_TAG

      - name: Build and push worker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd services/worker 
          docker build -t $ECR_REGISTRY/$WORKER_ECR_REPO:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$WORKER_ECR_REPO:$IMAGE_TAG

      - name: Build and push dashboard image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd services/dashboard 
          docker build -t $ECR_REGISTRY/$DASHBOARD_ECR_REPO:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$DASHBOARD_ECR_REPO:$IMAGE_TAG

      - name: Upload output of images
        id: images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "api_image=$ECR_REGISTRY/$API_ECR_REPO:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "dashboard_image=$ECR_REGISTRY/$DASHBOARD_ECR_REPO:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

